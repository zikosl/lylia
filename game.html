<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Universe ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #03030c;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
            height: 100vh;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem;
        }

        header {
            text-align: center;
            pointer-events: auto;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
            filter: drop-shadow(0 2px 10px rgba(255, 154, 158, 0.3));
        }

        header p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Memory Modal Card */
        .memory-card {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(18, 18, 35, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 154, 158, 0.3);
            padding: 2rem;
            border-radius: 24px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            pointer-events: auto;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(255, 154, 158, 0.15);
        }

        .memory-card.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .memory-date {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #ff9a9e;
            margin-bottom: 0.6rem;
            font-weight: 600;
        }

        .memory-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin-bottom: 0.8rem;
            color: #fff;
        }

        .memory-desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 1.8rem;
        }

        .close-btn {
            background: rgba(255, 154, 158, 0.1);
            border: 1px solid rgba(255, 154, 158, 0.3);
            color: #ff9a9e;
            padding: 0.6rem 1.8rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #ff9a9e;
            color: #03030c;
            box-shadow: 0 0 15px rgba(255, 154, 158, 0.5);
        }

        .instruction {
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            pointer-events: auto;
            animation: pulse 2.5s infinite ease-in-out;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            align-self: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        /* Mobile Adjustments */
        @media(max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .ui-layer { padding: 1.5rem; }
            .memory-card { bottom: 2rem; width: 92%; padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header>
            <h1>Our Universe</h1>
            <p>Click the glowing stars to explore our memories</p>
        </header>

        <div class="instruction" id="instruction-text">Drag to rotate • Scroll to zoom • Click stars</div>

        <!-- Dynamic Memory Popup Card -->
        <div class="memory-card" id="memoryCard">
            <div class="memory-date" id="cardDate"></div>
            <div class="memory-title" id="cardTitle"></div>
            <div class="memory-desc" id="cardDesc"></div>
            <button class="close-btn" onclick="closeMemory()">Close</button>
        </div>
    </div>

    <!-- Three.js & OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- CUSTOMIZE YOUR MEMORIES HERE ---
        const memories = [
            {
                title: "The Day We Talked a Lot",
                date: "October 8",
                desc: "The day we talked a lot, filling hours with endless connection and words that meant everything.",
                position: { x: -3, y: 1.5, z: -2 }
            },
            {
                title: "The First Day",
                date: "October 23",
                desc: "The very first day our paths crossed and everything started.",
                position: { x: 0, y: 0, z: 0 }
            },
            {
                title: "Deep Conversation",
                date: "October 25",
                desc: "The day we had a deep conversation, opening up and sharing pieces of our souls.",
                position: { x: 3.5, y: -1, z: 2 }
            },
            {
                title: "Silence & Distance",
                date: "October 27",
                desc: "The day you blocked me, turning the vibrant universe into a sudden, painful silence.",
                position: { x: -2, y: -2, z: 3 }
            },
            {
                title: "A Deep Wound",
                date: "November 15",
                desc: "The day u hurt me deeply, leaving a mark that's hard to look away from.",
                position: { x: 2, y: 2, z: -3 }
            }
        ];

        // --- SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03030c, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 15;
        controls.minDistance = 4;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff9a9e, 2, 20);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);

        // --- BACKGROUND STARFIELD ---
        const starCount = 1800;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);

        for(let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 65;
            starPositions[i+1] = (Math.random() - 0.5) * 65;
            starPositions[i+2] = (Math.random() - 0.5) * 65;
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.07,
            transparent: true,
            opacity: 0.6
        });
        const starField = new THREE.Points(starGeometry, starMaterial);
        scene.add(starField);

        // --- CREATE INTERACTIVE MEMORY ORBS ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactiveOrbs = [];

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.35, 'rgba(255, 154, 158, 0.85)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const orbTexture = createGlowTexture();
        const orbMaterial = new THREE.SpriteMaterial({
            map: orbTexture,
            transparent: true,
            blending: THREE.AdditiveBlending
        });

        memories.forEach((mem, index) => {
            const sprite = new THREE.Sprite(orbMaterial.clone());
            sprite.scale.set(0.9, 0.9, 0.9);
            sprite.position.set(mem.position.x, mem.position.y, mem.position.z);
            sprite.userData = { id: index, ...mem };
            scene.add(sprite);
            interactiveOrbs.push(sprite);
        });

        // --- INTERACTION & CLICK LOGIC ---
        let selectedOrb = null;

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveOrbs);

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                selectedOrb = hit;
                showMemory(hit.userData);
                controls.target.copy(hit.position);
            }
        });

        function showMemory(data) {
            document.getElementById('cardDate').innerText = data.date;
            document.getElementById('cardTitle').innerText = data.title;
            document.getElementById('cardDesc').innerText = data.desc;
            document.getElementById('memoryCard').classList.add('active');
            document.getElementById('instruction-text').style.opacity = '0';
        }

        function closeMemory() {
            document.getElementById('memoryCard').classList.remove('active');
            selectedOrb = null;
        }

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            starField.rotation.y = elapsedTime * 0.012;

            interactiveOrbs.forEach((orb, i) => {
                orb.position.y += Math.sin(elapsedTime * 2 + i) * 0.0012;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
